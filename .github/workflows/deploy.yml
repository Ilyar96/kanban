name: Deploy to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            PROJECT_PATH="${{ secrets.PROJECT_PATH || '/var/www/kanban' }}"
            DEPLOY_BRANCH="${{ github.ref_name }}"

            pm2_exec() {
              if command -v pm2 >/dev/null 2>&1; then
                pm2 "$@"
              else
                npx --yes pm2 "$@"
              fi
            }

            cd "$PROJECT_PATH"

            git fetch --all --prune
            git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            echo "== Backend deploy =="
            cd backend
            npm ci
            npm run prisma:generate
            npm run prisma:deploy

            echo "== PM2 deploy =="
            if pm2_exec describe backend >/dev/null 2>&1; then
              pm2_exec restart backend --update-env
            else
              pm2_exec start npm --name backend -- run start
            fi
            pm2_exec save

            echo "== Frontend deploy =="
            cd ../frontend
            npm ci
            VITE_ENABLE_IMAGE_OPTIMIZER=false npm run build

            if command -v nginx >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo nginx -t
                sudo systemctl reload nginx
              else
                nginx -t
                systemctl reload nginx
              fi
            fi

            echo "Deploy completed successfully"
