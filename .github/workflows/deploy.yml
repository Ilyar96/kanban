name: Deploy frontend and backend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build frontend and deploy application to server
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_ENABLE_IMAGE_OPTIMIZER: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed directories
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            frontend=true
            backend=true
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            frontend=false
            backend=false

            if grep -q '^frontend/' <<< "$changed_files"; then frontend=true; fi
            if grep -q '^backend/' <<< "$changed_files"; then backend=true; fi
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

      - name: Install backend production dependencies
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Generate Prisma Client
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: npx prisma generate

      - name: Package backend deployment
        if: steps.changes.outputs.backend == 'true'
        run: tar -czf backend-deploy.tar.gz --exclude='.env' --exclude='.env.*' --exclude='.git' -C backend package.json package-lock.json prisma.config.ts src prisma node_modules

      - name: Upload production build to server
        if: steps.changes.outputs.frontend == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "frontend/dist"
          target: "/var/www/kanban/frontend"
          strip_components: 1
          rm: true

      - name: Reload nginx
        if: steps.changes.outputs.frontend == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            sudo mkdir -p /var/www/kanban/frontend
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Upload backend package to server
        if: steps.changes.outputs.backend == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "backend-deploy.tar.gz"
          target: "/tmp/"

      - name: Deploy backend on server
        if: steps.changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 5m
          command_timeout: 30m
          script: |
            set -e

            PROJECT_DIR="/var/www/kanban"
            BACKEND_DIR="$PROJECT_DIR/backend"
            ARCHIVE="/tmp/backend-deploy.tar.gz"

            if [ ! -f "$BACKEND_DIR/.env" ]; then
              echo "Backend .env not found at $BACKEND_DIR"
              exit 1
            fi

            if [ ! -f "$ARCHIVE" ]; then
              echo "Backend deployment package not found at $ARCHIVE"
              exit 1
            fi

            tar -xzf "$ARCHIVE" -C "$BACKEND_DIR"
            rm -f "$ARCHIVE"

            cd "$BACKEND_DIR"
            ./node_modules/.bin/prisma migrate deploy

            if pm2 describe kanban >/dev/null 2>&1; then
              pm2 restart kanban --update-env
            else
              pm2 start npm --name kanban -- start
            fi

            pm2 save

            attempt=1
            while [ "$attempt" -le 30 ]; do
              if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
                echo "Backend health check passed"
                exit 0
              fi

              echo "Waiting for backend health check ($attempt/30)"
              sleep 2
              attempt=$((attempt + 1))
            done

            echo "Backend health check failed"
            pm2 logs kanban --lines 80 --nostream || true
            exit 1
